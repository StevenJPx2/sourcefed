name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  pi-integration:
    name: Pi integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:tui
      - run: npm run build:public
      - name: Pi integration on the locked development host
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" node scripts/assert-pi-host.mjs
          npm run integration -- pi.test.mjs pi-package.test.mjs
      - name: Pi integration on the Pi 0.83.0 host
        env:
          LEGACY_PI: ${{ runner.temp }}/pi-0.83.0
        run: |
          npm install --prefix "$LEGACY_PI" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.83.0
          export PATH="$LEGACY_PI/node_modules/.bin:$PATH"
          node scripts/assert-pi-host.mjs 0.83.0
          node scripts/integration.mjs pi.test.mjs pi-package.test.mjs
