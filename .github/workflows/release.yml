name: Release

# A v* tag verifies the package, then waits for the release environment's owner
# approval. npm authenticates release.yml / release with OIDC, not NPM_TOKEN.
# Configure both services before merging this workflow; see docs/release-automation.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require the protected release environment
        run: node scripts/release/environment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The tag names the package's version
        run: test "v$(node -p "require('./packages/sourcefed/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check

  publish:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11 for trusted publishing
        run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run check
      - name: Publish after environment approval
        working-directory: packages/sourcefed
        run: npm publish --access public --provenance
