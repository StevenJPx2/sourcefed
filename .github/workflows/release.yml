name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate against the npm registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LATEST="$(npm view @fdcn/sourcefed dist-tags.latest)"
          if [ "$VERSION" != "$LATEST" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match npm latest ${LATEST}; refusing to release"
            exit 1
          fi
          echo "releasing @fdcn/sourcefed@${VERSION}"

      - name: Download the published tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL "https://registry.npmjs.org/@fdcn/sourcefed/-/sourcefed-${VERSION}.tgz" \
            -o "fdcn-sourcefed-${VERSION}.tgz"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "fdcn-sourcefed-${VERSION}.tgz" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "sourcefed v${VERSION}" \
            --notes "Install: \`npm install --global @fdcn/sourcefed\` or \`brew install stevenjpx2/tap/sourcefed\`. Host plugins: add \`@fdcn/sourcefed@${VERSION}\` to \`opencode.json\`/\`tui.json\` or \`pi install npm:@fdcn/sourcefed@${VERSION}\`." \
            --generate-notes
